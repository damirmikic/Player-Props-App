# /etc/nginx/sites-available/player-props  (symlink into sites-enabled)
# Replace props.example.com with your domain. For HTTPS run:
#   sudo certbot --nginx -d props.example.com
server {
    listen 80;
    listen [::]:80;
    server_name props.example.com;

    # Optional basic auth (create with: sudo htpasswd -c /etc/nginx/.htpasswd user)
    # auth_basic "Restricted";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # first /api/props call can be slow (cold caches)
    }
}
